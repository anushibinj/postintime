spring:
  datasource:
    url: jdbc:tc:postgresql:16:///postintime
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-for-integration-tests-must-be-long-enough
  storage:
    type: local
    local-path: ./target/test-storage
